:root { color-scheme: light; --ink: #172033; --muted: #526078; --link: #174ea6; --line: #dce3ed; --paper: #fff; --wash: #f4f7fb; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--wash); color: var(--ink); font: 16px/1.7 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
a { color: var(--link); text-underline-offset: .15em; }
a:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
header, main, footer { width: min(100% - 2rem, 1024px); margin-inline: auto; }
header { padding-block: 2rem 1rem; }
.brand { font-weight: 700; text-decoration: none; }
main { margin-block: 1rem 3rem; padding: clamp(1.25rem, 4vw, 3rem); background: var(--paper); border: 1px solid var(--line); border-radius: 1rem; box-shadow: 0 8px 32px rgb(23 32 51 / 5%); }
h1, h2, h3 { line-height: 1.25; }

.meta { color: var(--muted); }
.contents { margin-block: 1.5rem 2rem; padding: 1.25rem 1.5rem; background: var(--wash); border-radius: .75rem; }
.contents h2 { margin: 0 0 .5rem; padding: 0; border: 0; font-size: 1.2rem; }
.contents ul { margin-block: .5rem 0; padding-left: 1.3rem; columns: 2; column-gap: 2rem; }
.contents li { break-inside: avoid; }
.prose table { width: 100%; border-collapse: collapse; display: block; overflow-x: auto; }
.prose th, .prose td { padding: .55rem .7rem; border: 1px solid var(--line); text-align: left; vertical-align: top; }
.prose th { background: var(--wash); }
.prose blockquote { margin-inline: 0; padding-inline: 1rem; border-left: 3px solid var(--link); color: var(--muted); }
.prose img { max-width: 100%; height: auto; }
footer { padding-block: 0 2rem; color: var(--muted); font-size: .9rem; }
@media (max-width: 640px) { .contents ul { columns: 1; } main { padding: 1.25rem; } }

.content-list { list-style: none; margin: 1.5rem 0 0; padding: 0; }
.content-list a { display: block; padding: 1.25rem 1.4rem; border: 1px solid var(--line); border-radius: .75rem; text-decoration: none; }
.content-list a:hover { background: var(--wash); }
.content-list strong { display: block; font-size: 1.2rem; }
.content-list span { color: var(--muted); font-size: .95rem; }
